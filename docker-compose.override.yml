version: '3.8'
services:
  app:
    build: .
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./:/app:delegated
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/newspaper_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A src.worker.celery_app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./:/app:delegated
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/newspaper_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
